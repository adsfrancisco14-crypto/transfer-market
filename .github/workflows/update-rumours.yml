name: TRANSFER MARKET - Atualização automática

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer-market-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar motor V7.2
        run: python atualizar_rumores.py

      - name: Guardar notícias atualizadas
        run: |
          git config user.name "TRANSFER MARKET Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add candidatos.json
          git add historico_transferencias.json
          git add relatorio_fontes.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática das notícias"
            git push
          else
            echo "Não existem alterações."
          fi
