name: TRANSFER MARKET - Atualização automática

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer-market-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m py_compile atualizar_rumores.py

      - name: Executar motor
        run: python atualizar_rumores.py

      - name: Guardar dados atualizados
        run: |
          git config user.name "TRANSFER MARKET Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add candidatos.json historico_transferencias.json relatorio_fontes.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualização automática do radar de transferências"
            git push
          else
            echo "Sem alterações para guardar."
          fi
